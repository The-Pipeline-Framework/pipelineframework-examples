quarkus.lambda.handler=aws-durable-action
pipeline.orchestrator.process-loops-disabled=true
pipeline.orchestrator.mode=QUEUE_ASYNC
pipeline.orchestrator.pipeline-id=org.pipelineframework.awsconformance
pipeline.orchestrator.release-version=conformance-release-1
pipeline.orchestrator.idempotency-policy=CLIENT_KEY_REQUIRED
pipeline.orchestrator.state-provider=dynamo
pipeline.orchestrator.dispatcher-provider=sqs
pipeline.orchestrator.dlq-provider=sqs
pipeline.orchestrator.releases.registry.provider=dynamo
pipeline.orchestrator.strict-startup=true
pipeline.orchestrator.max-retries=3
pipeline.orchestrator.retry-delay=PT2S
pipeline.orchestrator.sweep-limit=100
pipeline.orchestrator.sqs.local-loopback=false
pipeline.orchestrator.worker.execution-mode=SAME_THREAD
pipeline.orchestrator.worker.max-in-flight=16
pipeline.orchestrator.worker.sqs.server-enabled=true
pipeline.orchestrator.worker.sqs.pipeline-id=org.pipelineframework.awsconformance
pipeline.orchestrator.worker.sqs.release-version=conformance-release-1
pipeline.orchestrator.worker.sqs.request-timeout=PT60S
pipeline.orchestrator.worker.sqs.signature-tolerance=PT5M
quarkus.rest-client.process-first-approval.url=@conformance.operation.http.url@
quarkus.rest-client.process-second-approval.url=@conformance.operation.http.url@
quarkus.index-dependency.conformance-common.group-id=org.pipelineframework
quarkus.index-dependency.conformance-common.artifact-id=pipelineframework-aws-durable-conformance-common
