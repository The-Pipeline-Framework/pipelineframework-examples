# This deployable hosts the actual generated REST resources, with no coordinator loop.
pipeline.orchestrator.process-loops-disabled=true
pipeline.orchestrator.strict-startup=false
pipeline.orchestrator.mode=SYNC
pipeline.orchestrator.state-provider=memory
pipeline.orchestrator.releases.registry.provider=memory
pipeline.orchestrator.worker.sqs.server-enabled=false
quarkus.index-dependency.conformance-fixture.group-id=org.pipelineframework
quarkus.index-dependency.conformance-fixture.artifact-id=pipelineframework-aws-durable-conformance-common
quarkus.rest-client.process-first-approval.url=http://127.0.0.1:8080
quarkus.rest-client.process-second-approval.url=http://127.0.0.1:8080
quarkus.devservices.enabled=false
