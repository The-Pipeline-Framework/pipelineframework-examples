name: AWS Durable Historical Diagnostics and Production Gate

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Historical diagnostics or production evidence gate
        required: true
        default: full
        type: choice
        options:
          - full
          - promotion
          - history
      candidate_sha:
        description: Exact runtime candidate SHA (required for production promotion)
        required: false
        type: string
      examples_sha:
        description: Exact examples producer SHA (required for production promotion)
        required: false
        type: string
      production_run_id:
        description: Trusted run containing the production artifacts and real-AWS evidence bundle
        required: false
        type: string
      compiler_sha:
        description: Exact compiler source SHA from the production build
        required: false
        type: string
      bom_sha:
        description: Exact BOM source SHA from the production build
        required: false
        type: string
      production_bundle:
        description: Artifact bundle name from that trusted production run
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-durable-proof
  cancel-in-progress: false

jobs:
  production-promotion:
    if: github.event_name == 'workflow_dispatch' && inputs.lane == 'promotion'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: aws-durable-proof
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify deployment-free promotion gate tests
        run: ./mvnw -pl aws-durable-proof/production-tests -am verify -Dmaven.repo.local="$PWD/.m2/repository" --no-transfer-progress
      - name: Require exact production candidate evidence
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EXAMPLES_SHA: ${{ inputs.examples_sha }}
          PRODUCTION_RUN_ID: ${{ inputs.production_run_id }}
          PRODUCTION_BUNDLE: ${{ inputs.production_bundle }}
          COMPILER_SHA: ${{ inputs.compiler_sha }}
          BOM_SHA: ${{ inputs.bom_sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "Exact runtime candidate SHA required" >&2; exit 2; }
          [[ "$PRODUCTION_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Trusted production run ID required" >&2; exit 2; }
          [[ "$EXAMPLES_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "Exact examples producer SHA required" >&2; exit 2; }
          test -n "$PRODUCTION_BUNDLE"
          [[ "$COMPILER_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "Exact compiler source SHA required" >&2; exit 2; }
          [[ "$BOM_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "Exact BOM source SHA required" >&2; exit 2; }
      - name: Validate production run provenance
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EXAMPLES_SHA: ${{ inputs.examples_sha }}
          PRODUCTION_RUN_ID: ${{ inputs.production_run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCTION_RUN_ID" > "$RUNNER_TEMP/production-run.json"
          python3 - "$RUNNER_TEMP/production-run.json" <<'PY'
          import json, os, sys
          run = json.load(open(sys.argv[1]))
          assert run["status"] == "completed" and run["conclusion"] == "success", "Production evidence run did not succeed"
          assert run["head_sha"] == os.environ["EXAMPLES_SHA"], "Run is not the exact examples producer"
          assert run["head_repository"]["full_name"] == os.environ["GITHUB_REPOSITORY"], "Evidence came from another repository"
          assert run["path"] == ".github/workflows/aws-durable-proof.yml", "Untrusted producer workflow"
          assert run["event"] == "workflow_dispatch", "Production producer must use explicit dispatch"
          PY
      - name: Download exact production artifacts and raw run evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_RUN_ID: ${{ inputs.production_run_id }}
          PRODUCTION_BUNDLE: ${{ inputs.production_bundle }}
        run: |
          gh run download "$PRODUCTION_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$PRODUCTION_BUNDLE" --dir "$RUNNER_TEMP/production-conformance"
      - name: Reject proof substitutes and incomplete production evidence
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EXAMPLES_SHA: ${{ inputs.examples_sha }}
          COMPILER_SHA: ${{ inputs.compiler_sha }}
          BOM_SHA: ${{ inputs.bom_sha }}
        run: |
          bundle="$RUNNER_TEMP/production-conformance"
          python3 aws-durable-proof/scripts/verify-production-conformance.py \
            --action-archive "$bundle/function.zip" \
            --coordinator-archive "$bundle/coordinator.jar" \
            --deployment-archive "$bundle/deployment.jar" \
            --template "$bundle/aws-durable-queue-async.yaml" \
            --operation-http-archive "$bundle/operation-http.zip" \
            --item-archive "$bundle/item-function.zip" \
            --evidence "$bundle/production-report.json" \
            --runtime-sha "$CANDIDATE_SHA" \
            --compiler-sha "$COMPILER_SHA" \
            --bom-sha "$BOM_SHA" \
            --examples-sha "$EXAMPLES_SHA"
  deployed-proof:
    if: github.event_name == 'workflow_dispatch' && (inputs.lane == 'full' || inputs.lane == 'history')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: aws-durable-proof
    env:
      PROOF_ACCOUNT_ID: '207828640987'
      PROOF_REGION: us-east-2
      PROOF_CLOUDFORMATION_ROLE: ${{ vars.AWS_DURABLE_PROOF_CLOUDFORMATION_ROLE_ARN }}
      PROOF_EXECUTION_BOUNDARY: ${{ vars.AWS_DURABLE_PROOF_EXECUTION_BOUNDARY_ARN }}
      PROOF_LANE: ${{ inputs.lane }}
      PROOF_STACK: tpf-durable-${{ github.run_id }}-${{ github.run_attempt }}
      PROOF_TEST_REPORT: aws-durable-proof/fault-tests/target/failsafe-reports/TEST-org.pipelineframework.awsproof.DeployedAwsDurableProofIT.xml
    steps:
      - name: Select diagnostic evidence and check configuration
        id: diagnostics
        env:
          ROLE_ARN: ${{ vars.AWS_DURABLE_PROOF_ROLE_ARN }}
        run: |
          case "$PROOF_LANE" in
            full) report=aws-durable-proof/proof-report.json ;;
            history) report=aws-durable-proof/history-loss-evidence.json ;;
            *) echo "::error::Unsupported diagnostic lane"; exit 2 ;;
          esac
          echo "report=$report" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::AWS Durable diagnostics must run from main"
            exit 1
          fi
          if [[ "$ROLE_ARN" != "arn:aws:iam::$PROOF_ACCOUNT_ID:role/tpf-examples-durable-diagnostics" ]]; then
            echo "::error::Set AWS_DURABLE_PROOF_ROLE_ARN to the Examples diagnostics role in account $PROOF_ACCOUNT_ID"
            exit 1
          fi
          if [[ "$PROOF_CLOUDFORMATION_ROLE" != "arn:aws:iam::$PROOF_ACCOUNT_ID:role/tpf-examples-durable-diagnostics-cfn" ]]; then
            echo "::error::Set AWS_DURABLE_PROOF_CLOUDFORMATION_ROLE_ARN to the diagnostics CloudFormation role"
            exit 1
          fi
          if [[ "$PROOF_EXECUTION_BOUNDARY" != "arn:aws:iam::$PROOF_ACCOUNT_ID:policy/tpf-examples-durable-diagnostics-workload" ]]; then
            echo "::error::Set AWS_DURABLE_PROOF_EXECUTION_BOUNDARY_ARN to the diagnostics workload permissions boundary"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-path: ${{ github.workspace }}/.m2/repository
      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.AWS_DURABLE_PROOF_ROLE_ARN }}
          aws-region: ${{ env.PROOF_REGION }}
          allowed-account-ids: ${{ env.PROOF_ACCOUNT_ID }}
          role-session-name: tpf-durable-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 7200
      - name: Run disposable historical diagnostics (not production promotion)
        run: |
          lane_args=()
          case "$PROOF_LANE" in
            full) ;;
            history) lane_args+=(--history-only) ;;
            *) echo "Unsupported proof lane: $PROOF_LANE" >&2; exit 2 ;;
          esac
          ./aws-durable-proof/scripts/run-deployed-proof.sh \
            --region "$PROOF_REGION" \
            --stack-name "$PROOF_STACK" \
            --cloudformation-role-arn "$PROOF_CLOUDFORMATION_ROLE" \
            --execution-boundary-arn "$PROOF_EXECUTION_BOUNDARY" \
            "${lane_args[@]}"
      - name: Require passing diagnostic evidence
        env:
          PROOF_REPORT: ${{ steps.diagnostics.outputs.report }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = json.loads(Path(os.environ["PROOF_REPORT"]).read_text(encoding="utf-8"))
          if (report.get("stack"), report.get("region")) != (os.environ["PROOF_STACK"], os.environ["PROOF_REGION"]):
              raise SystemExit("Diagnostic report does not match this run's stack and region")
          evidence = report["evidence"]
          groups = {entry["group"] for entry in evidence}
          history_group = "provider-history-loss-recovery"
          if history_group not in groups or any(entry["status"] != "PASSED" for entry in evidence):
              raise SystemExit("Diagnostic report lacks passing history recovery or contains failed evidence")

          suite = ET.parse(os.environ["PROOF_TEST_REPORT"]).getroot()
          cases = suite.findall("testcase")
          if (not cases or int(suite.attrib["tests"]) != len(cases)
                  or any(int(suite.attrib[key]) != 0 for key in ("failures", "errors", "skipped"))
                  or any(case.find(tag) is not None for case in cases for tag in ("failure", "error", "skipped"))):
              raise SystemExit("Diagnostic test report must contain executed tests with no failures, errors or skips")
          history_test = "providerHistoryLossRecoversFromTheTpfSemanticCheckpoint"
          test_names = [case.attrib["name"] for case in cases]
          if os.environ["PROOF_LANE"] == "history":
              if test_names != [history_test] or groups != {history_group}:
                  raise SystemExit("History lane must execute only the history recovery test")
          elif history_test not in test_names or len(set(test_names)) < 2 or len(groups) < 2:
              raise SystemExit("Full lane must execute history recovery and the wider diagnostic suite")
          PYTHON
      - name: Upload proof evidence
        if: always() && steps.diagnostics.outputs.report != ''
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: aws-durable-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.diagnostics.outputs.report }}
            ${{ env.PROOF_TEST_REPORT }}
          if-no-files-found: warn
          retention-days: 30
