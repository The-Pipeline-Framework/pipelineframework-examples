name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-path: ${{ github.workspace }}/.m2/repository
      - name: Verify Block candidate BOM alignment
        run: python3 scripts/test-bom-alignment.py
      - name: Verify system-test suite cleanup
        run: python3 scripts/test-system-test-suite.py
      - name: Verify Restaurant self-host result decoding
        run: python3 -m unittest discover -s restaurant-approval/self-host -p 'test_*.py'
      - name: Verify examples
        run: ./mvnw clean verify -U -Dgpg.skip -Dquarkus.http.test-port=0 -Dquarkus.grpc.server.test-port=0 -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2/repository"
