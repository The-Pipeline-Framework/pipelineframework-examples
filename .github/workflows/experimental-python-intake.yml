name: Experimental Python intake

on:
  pull_request:
    paths:
      - "research/python-local-intake/**"
      - ".github/workflows/experimental-python-intake.yml"
  push:
    branches: [main]
    paths:
      - "research/python-local-intake/**"
      - ".github/workflows/experimental-python-intake.yml"

permissions:
  contents: read

jobs:
  python-intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHON_IMAGE: python@sha256:dddfd7e07f9d15aeeca61529320492139d21cac7f0070c00609243e51e4e0016
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pull the pinned CPython image
        run: docker pull "$PYTHON_IMAGE"
      - name: Probe CPython without Java, Node or network
        run: |
          docker run --rm --pull=never --network none -v "$PWD:/work:ro" -w /work \
            "$PYTHON_IMAGE" python research/python-local-intake/run_probes.py
      - name: Check candidate nominal type shapes
        run: |
          docker run --rm --pull=never -v "$PWD:/work:ro" -w /work \
            "$PYTHON_IMAGE" sh -eu -c '
              python -m pip install --disable-pip-version-check --no-cache-dir -r research/python-local-intake/requirements-test.txt
              python research/python-local-intake/check_types.py
            '
