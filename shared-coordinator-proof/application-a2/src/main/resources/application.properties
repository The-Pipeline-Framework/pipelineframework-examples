quarkus.devservices.enabled=false
quarkus.http.host=127.0.0.1
pipeline.orchestrator.mode=SYNC
pipeline.orchestrator.worker.rest.server-enabled=true
pipeline.orchestrator.worker.rest.shared-secret-ref=sys:tpf.proof.worker.secret
quarkus.grpc.server.use-separate-server=false
quarkus.otel.sdk.disabled=true

# The Lambda HTTP bridge owns the handler in this package.
quarkus.class-loading.removed-resources."org.pipelineframework\:pipelineframework-aws-durable-coordination-host"=org/pipelineframework/aws/durable/AwsDurableActionGatewayHandler.class,org/pipelineframework/aws/durable/AwsDurableAwaitCompletionHandler.class,org/pipelineframework/aws/durable/AwsDurableAwaitWakeupHandler.class,org/pipelineframework/aws/durable/AwsDurableCoordinatorHandler.class,org/pipelineframework/aws/durable/AwsDurableDueWorkHandler.class,org/pipelineframework/aws/durable/AwsDurableExecutionWakeupHandler.class,org/pipelineframework/aws/durable/AwsDurableIngressHandler.class,org/pipelineframework/aws/durable/AwsDurableReconciliationHandler.class,org/pipelineframework/aws/durable/AwsDurableTransitionWorkerHandler.class,org/pipelineframework/aws/durable/AwsDurableWorkItemHandler.class
