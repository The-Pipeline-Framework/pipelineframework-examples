version: 3
appName: Restaurant Approval
basePackage: org.pipelineframework.restaurantapproval
transport: REST
platform: COMPUTE
contract: {input: PlaceRestaurantOrderRequest, output: TerminalOrderState}
types:
  PlaceRestaurantOrderRequest:
    java: org.pipelineframework.restaurantapproval.common.domain.PlaceRestaurantOrderRequest
    fields:
      - [requestId, uuid]
      - [customerName, string]
      - [restaurantName, string]
      - [items, string]
      - [totalAmount, decimal]
      - [currency, string]
  ValidatedRestaurantOrderRequest:
    java: org.pipelineframework.restaurantapproval.common.domain.ValidatedRestaurantOrderRequest
    fields:
      - [requestId, uuid]
      - [customerName, string]
      - [restaurantName, string]
      - [items, string]
      - [totalAmount, decimal]
      - [currency, string]
      - [validatedAt, timestamp]
  PendingRestaurantApproval:
    java: org.pipelineframework.restaurantapproval.common.domain.PendingRestaurantApproval
    fields:
      - [orderId, uuid]
      - [requestId, uuid]
      - [customerName, string]
      - [restaurantName, string]
      - [items, string]
      - [totalAmount, decimal]
      - [currency, string]
      - [createdAt, timestamp]
  RestaurantOrderAccepted:
    java: org.pipelineframework.restaurantapproval.common.domain.RestaurantOrderAccepted
    fields:
      - [orderId, uuid]
      - [decidedAt, timestamp]
      - [note, string]
  RestaurantOrderDeclined:
    java: org.pipelineframework.restaurantapproval.common.domain.RestaurantOrderDeclined
    fields:
      - [orderId, uuid]
      - [decidedAt, timestamp]
      - [note, string]
      - [declineReason, string]
  TerminalOrderState:
    java: org.pipelineframework.restaurantapproval.common.domain.TerminalOrderState
    fields:
      - [orderId, uuid]
      - [outcome, string]
      - [resolvedAt, timestamp]
      - [restaurantStatus, string]
      - [summary, string]
  RestaurantDecision:
    java: org.pipelineframework.restaurantapproval.common.domain.RestaurantDecision
    variants:
      accepted: RestaurantOrderAccepted
      declined: RestaurantOrderDeclined
steps:
  - name: Validate Order Request
    service: org.pipelineframework.restaurantapproval.validate_order_request.service.ProcessValidateOrderRequestService
    cardinality: ONE_TO_ONE
    input: PlaceRestaurantOrderRequest
    output: ValidatedRestaurantOrderRequest
    java:
      input: org.pipelineframework.restaurantapproval.common.domain.PlaceRestaurantOrderRequest
      output: org.pipelineframework.restaurantapproval.common.domain.ValidatedRestaurantOrderRequest
  - name: Create Pending Approval
    service: org.pipelineframework.restaurantapproval.create_pending_approval.service.ProcessCreatePendingApprovalService
    cardinality: ONE_TO_ONE
    input: ValidatedRestaurantOrderRequest
    output: RestaurantDecision
    java:
      input: org.pipelineframework.restaurantapproval.common.domain.ValidatedRestaurantOrderRequest
      output: org.pipelineframework.restaurantapproval.common.domain.RestaurantDecision
    await:
      operationOutput:
        type: PendingRestaurantApproval
        java: org.pipelineframework.restaurantapproval.common.domain.PendingRestaurantApproval
      timeout: PT30M
      idempotency:
        fields: [orderId]
      correlation:
        strategy: interactionId
      transport:
        type: interaction-api
  - name: Finalize Restaurant Decision
    service: org.pipelineframework.restaurantapproval.finalize_restaurant_decision.service.ProcessFinalizeRestaurantDecisionService
    cardinality: ONE_TO_ONE
    input: RestaurantDecision
    output: TerminalOrderState
    java:
      input: org.pipelineframework.restaurantapproval.common.domain.RestaurantDecision
      output: org.pipelineframework.restaurantapproval.common.domain.TerminalOrderState
    terminal: true
